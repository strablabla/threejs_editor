<!-- Objects -->

<div class="panel_objects  input_interface" hidden >

  <div class="titlepanel" > Object </div>

  <style>
    /* Icon grid to pick the object to create. Scoped under .panel_objects so it beats the
       generic ".input_interface * { border:none }" rule. */
    .panel_objects .obj-grid {
          display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;
          padding:6px 16px 16px; margin-top:6px;
    }
    .panel_objects .obj-icon {
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
          padding:9px 4px; border:1px solid #dcdcdc; border-radius:9px; background:#fff; cursor:pointer;
          font-family:sans-serif; font-size:11px; letter-spacing:normal; color:#555;
          transition:background .12s, border-color .12s, box-shadow .12s;
    }
    .panel_objects .obj-icon svg { width:34px; height:34px; color:#444; }
    .panel_objects .obj-icon:hover { background:#f2f7ff; border-color:#9bbce8; }
    .panel_objects .obj-icon.active {
          background:#e3f0ff; border-color:#4285f4; color:#1a56b0;
          box-shadow:0 0 0 2px rgba(66,133,244,.25);
    }
    .panel_objects .obj-icon.active svg { color:#1a56b0; }
  </style>

  <!-- Tabs (handled by the generic .dyn_tab_btn switcher, scoped to .input_interface) -->
  <div class="dyn_tabs">
    <button type="button" class="dyn_tab_btn active" data-tab="tab_simple_objects">simple objects</button>
    <button type="button" class="dyn_tab_btn" data-tab="tab_complex_objects">complex objects</button>
    <button type="button" class="dyn_tab_btn" data-tab="tab_custom_objects">custom objects</button>
  </div>

  <!-- ===== Page: simple objects ===== -->
  <div id="tab_simple_objects" class="dyn_tab">

  <div id="obj_icon_grid" class="obj-grid">

    <button type="button" class="obj-icon" data-obj="wall" title="Wall — vertical wall segment">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="8" width="22" height="16" rx="1"/><line x1="5" y1="16" x2="27" y2="16" stroke-width="1.4"/><line x1="16" y1="8" x2="16" y2="16" stroke-width="1.4"/><line x1="10.5" y1="16" x2="10.5" y2="24" stroke-width="1.4"/><line x1="21.5" y1="16" x2="21.5" y2="24" stroke-width="1.4"/></svg>
      <span>wall</span>
    </button>

    <button type="button" class="obj-icon" data-obj="cube" title="Cube — solid block">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4 L28 11 L28 22 L16 29 L4 22 L4 11 Z"/><path d="M4 11 L16 18 L28 11 M16 18 L16 29" stroke-width="1.4"/></svg>
      <span>cube</span>
    </button>

    <button type="button" class="obj-icon" data-obj="plane" title="Plane — flat surface">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 23 L14 9 L27 9 L18 23 Z"/></svg>
      <span>plane</span>
    </button>

    <button type="button" class="obj-icon" data-obj="pavement" title="Pavement — tiled floor">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 23 L14 9 L27 9 L18 23 Z"/><line x1="9.5" y1="16" x2="22.5" y2="16" stroke-width="1"/><line x1="12.7" y1="11.7" x2="16.3" y2="20.3" stroke-width="1"/><line x1="18" y1="9" x2="14.5" y2="17.5" stroke-width="1"/></svg>
      <span>pavement</span>
    </button>

    <button type="button" class="obj-icon" data-obj="track" title="Track — road / path">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor"><path d="M4 27 C 11 6, 21 26, 28 6" stroke-width="3"/><path d="M4 27 C 11 6, 21 26, 28 6" stroke="#fff" stroke-width="0.9" stroke-dasharray="2.5 2.5"/></svg>
      <span>track</span>
    </button>

    <button type="button" class="obj-icon" data-obj="box" title="Box — open container (walls + optional lid)">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 8 L7 24 L25 24 L25 8"/><path d="M7 24 L11 27 L29 27 L25 24 M25 8 L29 11 L29 27" stroke-width="1.3"/></svg>
      <span>box</span>
    </button>

    <button type="button" class="obj-icon" data-obj="sphere" title="Sphere — a ball">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="12" rx="2.6" ry="1.6" fill="currentColor" opacity="0.45" transform="rotate(-40 12 12)"/></svg>
      <span>sphere</span>
    </button>

    <button type="button" class="obj-icon" data-obj="string" title="String — chain of springs">
      <svg viewBox="0 0 32 32"><circle cx="4" cy="16" r="2.6" fill="currentColor"/><circle cx="28" cy="16" r="2.6" fill="currentColor"/><path d="M7 16 L10 10 L13 22 L16 10 L19 22 L22 10 L25 16" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>string</span>
    </button>

    <button type="button" class="obj-icon" data-obj="no_tool" title="No tool — stop creating">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><line x1="8.2" y1="8.2" x2="23.8" y2="23.8"/></svg>
      <span>no tool</span>
    </button>

  </div>

  </div><!-- /tab_simple_objects -->

  <!-- ===== Page: complex objects ===== -->
  <!-- Assemblies of simple objects, born already linked. Their parameters stay editable
       afterwards: click one of their balls and the Parameters panel grows a tissue section. -->
  <div id="tab_complex_objects" class="dyn_tab" style="display:none">

    <div class="obj-grid" id="obj_icon_grid_complex">

      <button type="button" class="obj-icon" data-obj="tissue" title="Tissue — grid of balls linked by springs">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 6 H26 M6 13 H26 M6 20 H26 M6 27 H26"/>
          <path d="M6 6 V27 M13 6 V27 M20 6 V27 M26 6 V27"/>
          <circle cx="6"  cy="6"  r="1.9" fill="currentColor" stroke="none"/><circle cx="13" cy="6"  r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="6"  r="1.9" fill="currentColor" stroke="none"/><circle cx="26" cy="6"  r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="6"  cy="13" r="1.9" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="13" r="1.9" fill="currentColor" stroke="none"/><circle cx="26" cy="13" r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="6"  cy="20" r="1.9" fill="currentColor" stroke="none"/><circle cx="13" cy="20" r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="20" r="1.9" fill="currentColor" stroke="none"/><circle cx="26" cy="20" r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="6"  cy="27" r="1.9" fill="currentColor" stroke="none"/><circle cx="13" cy="27" r="1.9" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="27" r="1.9" fill="currentColor" stroke="none"/><circle cx="26" cy="27" r="1.9" fill="currentColor" stroke="none"/>
        </svg>
        <span>tissue</span>
      </button>

    </div>

    <!-- Values used at CREATION. Afterwards each tissue carries its own, editable by
         clicking one of its balls (see the tissue section of the Parameters panel). -->
    <div style="padding:0 16px 14px; font-family:sans-serif; font-size:11px; color:#555">
      <div style="display:flex; gap:6px; align-items:center; margin-bottom:5px">
        <span style="flex:0 0 96px">balls (w &times; l)</span>
        <input type="number" id="tissue_nw_new" min="2" max="30" step="1" value="6" style="width:48px" title="number of balls across the width">
        <span>&times;</span>
        <input type="number" id="tissue_nl_new" min="2" max="30" step="1" value="6" style="width:48px" title="number of balls along the length">
      </div>
      <div style="display:flex; gap:6px; align-items:center; margin-bottom:5px">
        <span style="flex:0 0 96px">stiffness</span>
        <input type="number" id="tissue_k_new" min="0" step="0.01" style="width:70px" title="spring stiffness of the mesh (same scale as the global harmonic_const)">
      </div>
      <div style="display:flex; gap:6px; align-items:center">
        <span style="flex:0 0 96px">rest length</span>
        <input type="number" id="tissue_l0_new" min="1" step="5" style="width:70px" title="equilibrium distance between two neighbouring balls">
      </div>
      <div style="margin-top:7px; color:#888">Pick the tool, then click in the scene to drop a tissue.</div>
    </div>

  </div><!-- /tab_complex_objects -->

  <!-- ===== Page: custom objects ===== -->
  <div id="tab_custom_objects" class="dyn_tab" style="display:none">
    <div style="padding:18px 16px; font-family:sans-serif; font-size:12px; color:#888; text-align:center">
      Nothing here yet.<br><br>
      <span style="font-size:11px">This tab is meant for objects assembled and saved by hand,<br>to be reused as building blocks.</span>
    </div>
  </div><!-- /tab_custom_objects -->

</div>

<script>

{% set objs = ['wall', 'cube', 'plane', 'pavement', 'track',
                'box', 'sphere', 'string', 'tissue', 'no_tool'] %}
dict_obj_param = {}
{% for obj in objs %}
dict_obj_param['{{obj}}'] = 'new_' + '{{obj}}' + '_ok'
{% endfor %}

reinit_params_ok()

// Pick the object to create by clicking its icon (replaces the old <select>).
// Delegated on the whole panel: the icons now live in several tabs, and only one tool
// is active at a time across all of them.
$('.panel_objects').on('click', '.obj-icon', function(){
      var obj = $(this).attr('data-obj')
      reinit_params_ok()                                   // turn every creation tool off first
      var param = dict_obj_param[obj]
      if (param){ window[param] = true }                   // activate the chosen tool (incl. new_no_tool_ok)
      $('.panel_objects .obj-icon').removeClass('active')
      $(this).addClass('active')
      $('#active_obj_navbar').text(obj === 'no_tool' ? '' : $(this).find('span').text())  // active tool -> navbar
})

// --- Tissue: parameters used at creation ---
// They feed the globals read by make_new_tissue(); each tissue then keeps its own copy,
// editable afterwards from the Parameters panel.
;(function(){
      var fields = { tissue_nw_new:'tissue_nw', tissue_nl_new:'tissue_nl',
                     tissue_k_new:'tissue_k',   tissue_l0_new:'tissue_l0' }
      $.each(fields, function(id, globname){
            var $inp = $('#' + id)
            if (!$inp.length){ return }
            $inp.val(window[globname])
            $inp.on('input change', function(){
                  var v = parseFloat(this.value)
                  if (isFinite(v)){ window[globname] = v }
            })
            // TrackballControls is bound to document and preventDefault()s every mousedown,
            // and the scene shortcuts listen page-wide: without this the field cannot be
            // clicked into and typing digits would fire the scene commands.
            $inp.on('keydown keypress keyup mousedown mousemove mouseup dblclick', function(e){ e.stopPropagation() })
            $inp.on('keydown', function(e){ if (e.which === 13 || e.which === 27){ this.blur() } })
      })
})()

</script>
